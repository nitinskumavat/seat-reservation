spring.application.name=seat-reservation

spring.datasource.url=jdbc:postgresql://localhost:5433/seats
spring.datasource.username=seats
spring.datasource.password=seats
# Virtual threads remove the request-thread cap, so this pool is the real concurrency bound.
# Requests wait up to connection-timeout for a connection; a wait past it surfaces as a 5xx.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=30000

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,dbConnectivity

# JSON log lines (ECS); request_id comes from the MDC.
logging.structured.format.console=ecs

spring.jackson.property-naming-strategy=SNAKE_CASE

# Local default only; set ADMIN_TOKEN in any shared environment.
app.admin-token=${ADMIN_TOKEN:dev-admin-token}
# Local default only; set JWT_SECRET (32+ bytes) in any shared environment.
app.jwt-secret=${JWT_SECRET:dev-jwt-secret-change-me-0123456789abcdef}
