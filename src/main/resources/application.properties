spring.application.name=seat-reservation

spring.datasource.url=jdbc:postgresql://localhost:5433/seats
spring.datasource.username=seats
spring.datasource.password=seats

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.jackson.property-naming-strategy=SNAKE_CASE

# Local default only; set ADMIN_TOKEN in any shared environment.
app.admin-token=${ADMIN_TOKEN:dev-admin-token}
